name: Build Unity IPA Online

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/build-ios-trigger.txt'

permissions:
  contents: read

jobs:
  build:
    name: Build CBR YiYi IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact IOS.rar from Drive parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/input"

          python3 -m venv "$RUNNER_TEMP/gdown-venv"
          source "$RUNNER_TEMP/gdown-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet gdown

          python -m gdown "https://drive.google.com/uc?id=163cnCDJN_WE84iCbEBYJdrDRdW7Csimk" -O "$GITHUB_WORKSPACE/input/IOS.rar.part01"
          python -m gdown "https://drive.google.com/uc?id=1LworbdLPgvt6CSoKhxLgstGQqcUy1bCX" -O "$GITHUB_WORKSPACE/input/IOS.rar.part02"
          python -m gdown "https://drive.google.com/uc?id=1Oz7-xxoDo2YDFSkoV9OqIUKFGao2olij" -O "$GITHUB_WORKSPACE/input/IOS.rar.part03"

          echo "229ebf68280739ea4d08dba001203442b8356cebba5c6fac78a8328aee1e77f1  $GITHUB_WORKSPACE/input/IOS.rar.part01" | shasum -a 256 -c -
          echo "8a97bc68445889285eee2330f7de8ba0ae40239c9245909aa1a3a905669da763  $GITHUB_WORKSPACE/input/IOS.rar.part02" | shasum -a 256 -c -
          echo "874f46034b7567d36b12bf5069d57e2862cea38f20872788e9bc1c71a7b4364b  $GITHUB_WORKSPACE/input/IOS.rar.part03" | shasum -a 256 -c -

          cat "$GITHUB_WORKSPACE/input/IOS.rar.part01" \
              "$GITHUB_WORKSPACE/input/IOS.rar.part02" \
              "$GITHUB_WORKSPACE/input/IOS.rar.part03" \
              > "$GITHUB_WORKSPACE/input/IOS.rar"

          echo "f8dfeac59a9eedc2b9264a6864e05ff5b46305b995ea9a65bf0513f450a0601d  $GITHUB_WORKSPACE/input/IOS.rar" | shasum -a 256 -c -
          ls -lh "$GITHUB_WORKSPACE/input/IOS.rar"
          echo "RAR_FILE=$GITHUB_WORKSPACE/input/IOS.rar" >> "$GITHUB_ENV"

      - name: Install RAR extractor
        shell: bash
        run: |
          set -e
          if ! command -v unar >/dev/null 2>&1; then brew install unar; fi
          which unar

      - name: Extract Unity Xcode project
        shell: bash
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/xcode-source"
          mkdir -p "$GITHUB_WORKSPACE/xcode-source"
          unar -f -o "$GITHUB_WORKSPACE/xcode-source" "$RAR_FILE"

      - name: Find Unity Xcode project
        shell: bash
        run: |
          set -e
          PROJECT_PATH=$(find "$GITHUB_WORKSPACE/xcode-source" -type d -name "Unity-iPhone.xcodeproj" | head -1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: Khong tim thay Unity-iPhone.xcodeproj"
            find "$GITHUB_WORKSPACE/xcode-source" -maxdepth 5 -print | head -300
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Xcode version
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Check CocoaPods
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f "Podfile" ]; then
            if ! command -v pod >/dev/null 2>&1; then sudo gem install cocoapods; fi
            pod install
          fi

      - name: Detect Xcode workspace
        shell: bash
        run: |
          set -e
          WORKSPACE=$(find "$PROJECT_DIR" -maxdepth 1 -type d -name "*.xcworkspace" | head -1)
          if [ -n "$WORKSPACE" ]; then
            echo "XCODE_TYPE=workspace" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "XCODE_TYPE=project" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          fi

      - name: Check Xcode schemes
        shell: bash
        run: |
          set -e
          if [ "$XCODE_TYPE" = "workspace" ]; then
            xcodebuild -workspace "$XCODE_PATH" -list
          else
            xcodebuild -project "$XCODE_PATH" -list
          fi

      - name: Build Unity iOS App unsigned
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"
          COMMON_ARGS=(
            -scheme Unity-iPhone
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$GITHUB_WORKSPACE/build"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
          )
          if [ "$XCODE_TYPE" = "workspace" ]; then
            xcodebuild -workspace "$XCODE_PATH" "${COMMON_ARGS[@]}" build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          else
            xcodebuild -project "$XCODE_PATH" "${COMMON_ARGS[@]}" build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          fi

      - name: Find built app
        shell: bash
        run: |
          set -e
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/Build/Products" -type d -name "*.app" | grep "Release-iphoneos" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Khong tim thay file .app"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create Payload
        shell: bash
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/ipa-output"
          mkdir -p "$GITHUB_WORKSPACE/ipa-output/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa-output/Payload/"

      - name: Create IPA
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/ipa-output"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/CauBeRongYiYi-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/CauBeRongYiYi-unsigned.ipa"

      - name: Verify IPA
        shell: bash
        run: |
          set -e
          unzip -Z1 "$GITHUB_WORKSPACE/CauBeRongYiYi-unsigned.ipa" | grep -Eq '^Payload/[^/]+\.app/' || {
            echo "ERROR: IPA khong co cau truc Payload/*.app"
            exit 1
          }
          echo "IPA structure OK"
          shasum -a 256 "$GITHUB_WORKSPACE/CauBeRongYiYi-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CauBeRongYiYi-Unsigned-IPA
          path: CauBeRongYiYi-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
