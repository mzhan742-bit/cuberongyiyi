name: Build Unity IPA Online

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CBR YiYi IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Xcode build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release list --limit 20
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName')
          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: Khong tim thay Release."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/input"
          gh release download "$LATEST_TAG" --dir "$GITHUB_WORKSPACE/input"
          ls -lah "$GITHUB_WORKSPACE/input"
          RAR_FILE=$(find "$GITHUB_WORKSPACE/input" -maxdepth 1 -type f -iname "*.rar" | head -1)
          if [ -z "$RAR_FILE" ]; then
            echo "ERROR: Khong tim thay file .rar trong Release."
            exit 1
          fi
          echo "RAR_FILE=$RAR_FILE" >> "$GITHUB_ENV"

      - name: Install RAR extractor
        shell: bash
        run: |
          set -e
          if ! command -v unar >/dev/null 2>&1; then brew install unar; fi
          which unar

      - name: Extract Unity Xcode project
        shell: bash
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/xcode-source"
          mkdir -p "$GITHUB_WORKSPACE/xcode-source"
          unar -f -o "$GITHUB_WORKSPACE/xcode-source" "$RAR_FILE"

      - name: Find Unity Xcode project
        shell: bash
        run: |
          set -e
          PROJECT_PATH=$(find "$GITHUB_WORKSPACE/xcode-source" -type d -name "Unity-iPhone.xcodeproj" | head -1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: Khong tim thay Unity-iPhone.xcodeproj"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Xcode version
        shell: bash
        run: |
          set -e
          xcodebuild -version
          xcodebuild -showsdks

      - name: Check CocoaPods
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f "Podfile" ]; then
            if ! command -v pod >/dev/null 2>&1; then sudo gem install cocoapods; fi
            pod install
          fi

      - name: Detect Xcode workspace
        shell: bash
        run: |
          set -e
          WORKSPACE=$(find "$PROJECT_DIR" -maxdepth 1 -type d -name "*.xcworkspace" | head -1)
          if [ -n "$WORKSPACE" ]; then
            echo "XCODE_TYPE=workspace" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "XCODE_TYPE=project" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          fi

      - name: Check Xcode schemes
        shell: bash
        run: |
          set -e
          if [ "$XCODE_TYPE" = "workspace" ]; then
            xcodebuild -workspace "$XCODE_PATH" -list
          else
            xcodebuild -project "$XCODE_PATH" -list
          fi

      - name: Build Unity iOS App
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"
          if [ "$XCODE_TYPE" = "workspace" ]; then
            xcodebuild \
              -workspace "$XCODE_PATH" \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$GITHUB_WORKSPACE/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          else
            xcodebuild \
              -project "$XCODE_PATH" \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$GITHUB_WORKSPACE/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          fi

      - name: Find built app
        shell: bash
        run: |
          set -e
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/Build/Products" -type d -name "*.app" | grep "Release-iphoneos" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Khong tim thay file .app"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create Payload
        shell: bash
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/ipa-output"
          mkdir -p "$GITHUB_WORKSPACE/ipa-output/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa-output/Payload/"
          find "$GITHUB_WORKSPACE/ipa-output/Payload" -maxdepth 2 -print | head -100

      - name: Create IPA
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/ipa-output"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/CauBeRongYiYi-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/CauBeRongYiYi-unsigned.ipa"

      - name: Verify IPA
        shell: bash
        run: |
          set -e
          unzip -l "$GITHUB_WORKSPACE/CauBeRongYiYi-unsigned.ipa" | head -80
          unzip -Z1 "$GITHUB_WORKSPACE/CauBeRongYiYi-unsigned.ipa" | grep -Eq '^Payload/[^/]+\.app/' || {
            echo "ERROR: IPA khong co cau truc Payload/*.app"
            exit 1
          }
          echo "IPA structure OK: Payload/*.app"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CauBeRongYiYi-Unsigned-IPA
          path: CauBeRongYiYi-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
